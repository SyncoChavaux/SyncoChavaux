const el=id=>document.getElementById(id);
let groups=[], reportDate;
const formatDate=day=>new Intl.DateTimeFormat('fr-FR',{dateStyle:'long',timeZone:'UTC'}).format(new Date(day));
function age(item){
 const last=item.events.at(-1);
 return last ? (Date.parse(reportDate)-Date.parse(last.day))/86400000 : null;
}
function attention(item){return item.status.toLowerCase()!=='clos' && age(item)!==null && age(item)>=30}

const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function add(parent,tag,value,cls){const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;parent.append(n);return n}
function render(){
 const host=el('list'); host.replaceChildren();
 const needle=normalize(el('query').value.trim()), follow=el('follow').value;
 let count=0;
 for(const group of groups){
   if(el('topic').value && group.title!==el('topic').value) continue;
   const items=group.items.filter(item=>{
     const searchable=[group.title,group.summary,item.title,item.purpose,item.description,item.status,item.owner,item.action,item.expected,item.due,...item.events.map(e=>e.detail)].join(' ');
     return (!el('owner').value || item.owner===el('owner').value) && normalize(searchable).includes(needle)
       && (!follow || (follow==='old' ? attention(item) : age(item)===null));
   });
   if(!items.length) continue;
   count+=items.length;
   const box=add(host,'section','','topic'), head=add(box,'div','','topic-head');
   add(head,'h2',group.title);
   const old=items.filter(attention).length;
   add(head,'small',old ? old+' action'+(old>1?'s':'')+' sans jalon depuis 30 j ou plus' : items.length+' action'+(items.length>1?'s':''),old?'attention':'');
   add(box,'p',group.summary,'topic-summary');
   const history=add(box,'details','');add(history,'summary','Chronologie du sujet');
   const timeline=add(history,'ol','');
   const entries=items.flatMap(item=>item.events.map(e=>({...e,title:item.title}))).sort((a,b)=>b.day.localeCompare(a.day));
   for(const event of entries){
     const li=add(timeline,'li','');add(li,'time',formatDate(event.day)).dateTime=event.day;
     add(li,'strong',event.title);add(li,'p',event.detail);
   }
   if(!entries.length)add(history,'p','Aucun jalon daté consigné.');
   for(const item of items){
     const card=add(box,'article',''), left=add(card,'div',''),right=add(card,'div','');
     add(left,'span',item.status,'status');add(left,'h3',item.title);add(left,'p',item.purpose);
     add(left,'small','Point au '+formatDate(reportDate));add(left,'p',item.description);
     const days=age(item);
     add(left,'small',days===null?'Aucun jalon daté': 'Dernier repère le '+formatDate(item.events.at(-1).day)+' · '+days+' j',attention(item)?'stamp attention':'stamp');
     add(right,'small','Action attendue de ');add(right,'strong',item.owner);add(right,'p',item.action);
     add(right,'small','Résultat attendu');add(right,'p',item.expected);
     if(item.due)add(right,'strong',item.due,'stamp');
   }
 }
 el('count').textContent=count ? count+' action'+(count>1?'s':'')+' affichée'+(count>1?'s':'') : 'Aucune action ne correspond à ces filtres.';
}
el('query').oninput=render;
for(const id of ['topic','owner','follow']) el(id).onchange=render;
el('lock').onclick=()=>location.reload();
el('gate').onsubmit=async event=>{
 event.preventDefault();const btn=event.target.querySelector('button');btn.disabled=true;el('error').textContent='';
 try{const [salt,iv,body]=packed.map(s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(el('pass').value.trim()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,body)));
 groups=data.groups;reportDate=data.date;el('pass').value='';el('date').textContent='Compte-rendu du '+new Intl.DateTimeFormat('fr-FR',{dateStyle:'long',timeZone:'UTC'}).format(new Date(data.date));
 el('owner').add(new Option('Tous les responsables',''));for(const name of [...new Set(groups.flatMap(g=>g.items.map(i=>i.owner)))].sort((a,b)=>a.localeCompare(b,'fr')))el('owner').add(new Option(name,name));
 el('topic').add(new Option('Tous les sujets',''));for(const g of groups) el('topic').add(new Option(g.title,g.title));
 render();el('board').hidden=false;el('lock').hidden=false;el('gate').hidden=true;el('query').focus();
 }catch{el('error').textContent=window.crypto?.subtle?'Ouverture impossible. Vérifiez le code partagé.':'Ouvrez la page en HTTPS dans un navigateur récent.'}finally{btn.disabled=false}
};
</script></html>
