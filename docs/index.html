const el=id=>document.getElementById(id);
let rows=[];
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function add(parent,tag,value,cls){const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;parent.append(n);return n}
function render(){
 const host=el('list');host.replaceChildren();
 const shown=rows.filter(row=>(!el('owner').value||row[3]===el('owner').value)&&normalize(row.join(' ')).includes(normalize(el('query').value.trim())));
 el('count').textContent=shown.length+' sujet'+(shown.length>1?'s':'')+' sur '+rows.length;
 for(const [title,desc,status,owner,action,due] of shown){
 const card=add(host,'article',''),summary=add(card,'div',''),next=add(card,'div','');
 add(summary,'span',status,'status');add(summary,'h2',title);add(summary,'p',desc);
 add(next,'small','Action attendue de ');add(next,'strong',owner);add(next,'p',action);if(due)add(next,'small',due);
 }}
el('query').oninput=render;el('owner').onchange=render;
el('lock').onclick=()=>location.reload();
el('gate').onsubmit=async event=>{
 event.preventDefault();const btn=event.target.querySelector('button');btn.disabled=true;el('error').textContent='';
 try{const [salt,iv,body]=packed.map(s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(el('pass').value.trim()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,body)));
 rows=data.rows;el('pass').value='';el('date').textContent='Compte-rendu du '+new Intl.DateTimeFormat('fr-FR',{dateStyle:'long',timeZone:'UTC'}).format(new Date(data.date));
 el('owner').add(new Option('Tous les responsables',''));for(const name of [...new Set(rows.map(r=>r[3]))].sort((a,b)=>a.localeCompare(b,'fr')))el('owner').add(new Option(name,name));
 render();el('board').hidden=false;el('lock').hidden=false;el('gate').hidden=true;el('query').focus();
 }catch{el('error').textContent=window.crypto?.subtle?'Ouverture impossible. Vérifiez le code partagé.':'Ouvrez la page en HTTPS dans un navigateur récent.'}finally{btn.disabled=false}
};
</script></html>
